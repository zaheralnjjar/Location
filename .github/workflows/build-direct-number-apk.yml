name: Build Direct Number APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-phone-number-app-7ocimo
    paths:
      - "android-app/**"
      - ".github/workflows/build-direct-number-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: direct-number-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
